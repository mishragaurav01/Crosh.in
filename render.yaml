services:
  - type: web
    name: crosh-backend
    runtime: bun
    buildCommand: cd packages/db && bunx prisma generate && cd ../..
    startCommand: cd apps/backend && bun index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: crosh-frontend
    runtime: bun
    buildCommand: cd apps/frontend && bun run build
    startCommand: cd apps/frontend && bun run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
