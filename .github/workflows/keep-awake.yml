name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        env:
          BACKEND_URL: https://crosh-in.onrender.com/health
        run: |
          curl -fsS -o /dev/null -w "backend health: HTTP %{http_code} in %{time_total}s\n" "$BACKEND_URL"